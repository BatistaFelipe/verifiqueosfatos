<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Editor de declarações · Verifique os Fatos</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color-scheme: light; }
    body { margin: 0; background: #f5f6f8; color: #20242b; }
    main { max-width: 850px; margin: auto; padding: 24px 16px 60px; }
    h1 { margin-bottom: 4px; }
    .muted { color: #57606a; }
    .panel { background: white; border: 1px solid #d6dae0; border-radius: 12px; padding: 20px; margin-top: 20px; }
    .toolbar, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    button, .file-button { font: inherit; cursor: pointer; background: white; border: 1px solid #aab2bd; padding: 9px 13px; border-radius: 7px; }
    button.primary { background: #2057b5; color: #fff; border-color: #2057b5; }
    button.danger { color: #a01826; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .file-button input { display: none; }
    label.field { display: block; margin: 14px 0 5px; font-weight: 600; }
    select, textarea { width: 100%; box-sizing: border-box; border: 1px solid #aab2bd; border-radius: 7px; padding: 9px; font: inherit; }
    textarea { min-height: 110px; resize: vertical; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .post { border-top: 1px solid #e1e4e8; padding: 14px 0; }
    .post:first-child { border-top: 0; }
    .post p { margin: 5px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .post .actions { margin-top: 8px; }
    #message { min-height: 1.5em; }
    [hidden] { display: none !important; }
    @media (max-width: 500px) { .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Editor de declarações</h1>
    <p class="muted">Edite os registros localmente e baixe um novo <code>posts.json</code>. Nenhum dado ou credencial é enviado pelo editor.</p>

    <div class="panel">
      <div class="toolbar">
        <button type="button" id="load">Carregar posts.json do site</button>
        <label class="file-button">Importar JSON <input id="import" type="file" accept=".json,application/json"></label>
        <button type="button" id="add">Nova declaração</button>
        <button type="button" class="primary" id="download">Baixar posts.json</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <p class="muted"><small>Atenção: o botão de download não publica as alterações. Faça commit do arquivo exportado no repositório para atualizar o site.</small></p>
    </div>

    <section class="panel" id="form-panel" hidden>
      <h2 id="form-title">Nova declaração</h2>
      <form id="editor-form">
        <div class="fields">
          <div>
            <label class="field" for="candidate">Candidato</label>
            <select id="candidate" required>
              <option value="1">Lula</option>
              <option value="2">Flávio</option>
            </select>
          </div>
          <div>
            <label class="field" for="verdict">Veredito</label>
            <select id="verdict" required>
              <option value="1">Verdadeiro</option>
              <option value="2">Falso</option>
              <option value="3">Parcial</option>
            </select>
          </div>
        </div>
        <label class="field" for="statement">Declaração</label>
        <textarea id="statement" required maxlength="20000"></textarea>
        <label class="field" for="verification">Verificação e referências</label>
        <textarea id="verification" required maxlength="40000"></textarea>
        <div class="actions">
          <button class="primary" type="submit">Salvar no editor</button>
          <button type="button" id="cancel">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Declarações (<span id="count">0</span>)</h2>
      <div id="list"></div>
    </section>
  </main>
  <script>
    'use strict';
    const candidates = { 1: 'Lula', 2: 'Flávio' };
    const verdicts = { 1: 'Verdadeiro', 2: 'Falso', 3: 'Parcial' };
    const list = document.querySelector('#list');
    const formPanel = document.querySelector('#form-panel');
    const form = document.querySelector('#editor-form');
    const message = document.querySelector('#message');
    let posts = [];
    let editingIndex = null;
    let dirty = false;

    function notify(text, error = false) {
      message.textContent = text;
      message.style.color = error ? '#a01826' : '#245c2d';
    }

    function validate(data) {
      if (!Array.isArray(data)) throw new Error('O JSON precisa conter uma lista.');
      return data.map((post, index) => {
        if (!post || typeof post !== 'object' || Array.isArray(post) ||
            !Object.hasOwn(candidates, post.n) || !Object.hasOwn(verdicts, post.c) ||
            typeof post.t !== 'string' || !post.t.trim() ||
            typeof post.v !== 'string' || !post.v.trim()) {
          throw new Error('Registro ' + (index + 1) + ' inválido: use n, c, t e v.');
        }
        return { n: post.n, c: post.c, t: post.t, v: post.v };
      });
    }

    function draw() {
      document.querySelector('#count').textContent = posts.length;
      list.replaceChildren();
      if (!posts.length) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'Nenhuma declaração carregada.';
        list.append(empty);
      }
      posts.forEach((post, index) => {
        const article = document.createElement('article');
        article.className = 'post';
        const title = document.createElement('strong');
        title.textContent = (index + 1) + '. ' + candidates[post.n] + ' · ' + verdicts[post.c];
        const statement = document.createElement('p');
        statement.textContent = post.t;
        const verification = document.createElement('p');
        verification.className = 'muted';
        verification.textContent = post.v;
        const actions = document.createElement('div');
        actions.className = 'actions';
        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Editar';
        edit.addEventListener('click', () => openForm(index));
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'danger';
        remove.textContent = 'Excluir';
        remove.addEventListener('click', () => {
          if (!confirm('Excluir a declaração ' + (index + 1) + '?')) return;
          posts.splice(index, 1);
          dirty = true;
          formPanel.hidden = true;
          draw();
          notify('Declaração excluída localmente. Baixe o JSON para publicar.');
        });
        actions.append(edit, remove);
        article.append(title, statement, verification, actions);
        list.append(article);
      });
    }

    function openForm(index = null) {
      editingIndex = index;
      const post = index === null ? { n: 1, c: 1, t: '', v: '' } : posts[index];
      document.querySelector('#form-title').textContent = index === null ? 'Nova declaração' : 'Editar declaração';
      document.querySelector('#candidate').value = post.n;
      document.querySelector('#verdict').value = post.c;
      document.querySelector('#statement').value = post.t;
      document.querySelector('#verification').value = post.v;
      formPanel.hidden = false;
      formPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    async function importText(raw) {
      const parsed = validate(JSON.parse(raw));
      if (dirty && !confirm('Substituir as alterações ainda não exportadas?')) return;
      posts = parsed;
      dirty = false;
      formPanel.hidden = true;
      draw();
      notify(posts.length + ' declarações carregadas.');
    }

    document.querySelector('#load').addEventListener('click', async () => {
      try {
        const response = await fetch('../posts.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        await importText(await response.text());
      } catch (error) { notify('Falha ao carregar: ' + error.message, true); }
    });

    document.querySelector('#import').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try { await importText(await file.text()); }
      catch (error) { notify('Arquivo inválido: ' + error.message, true); }
      event.target.value = '';
    });

    document.querySelector('#add').addEventListener('click', () => openForm());
    document.querySelector('#cancel').addEventListener('click', () => { formPanel.hidden = true; });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const post = {
        n: Number(document.querySelector('#candidate').value),
        c: Number(document.querySelector('#verdict').value),
        t: document.querySelector('#statement').value.trim(),
        v: document.querySelector('#verification').value.trim()
      };
      try { validate([post]); }
      catch (error) { notify(error.message, true); return; }
      if (editingIndex === null) posts.push(post);
      else posts[editingIndex] = post;
      dirty = true;
      formPanel.hidden = true;
      draw();
      notify('Salvo localmente. Baixe o JSON para publicar.');
    });

    document.querySelector('#download').addEventListener('click', () => {
      const json = JSON.stringify(validate(posts), null, 2) + '\n';
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'posts.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      dirty = false;
      notify('Arquivo posts.json gerado. Substitua o arquivo no GitHub.');
    });

    window.addEventListener('beforeunload', (event) => {
      if (!dirty) return;
      event.preventDefault();
      event.returnValue = '';
    });

    draw();
  </script>
</body>
</html>
