<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/normalize.css">
  <link rel="stylesheet" href="/style.css">

  <title>Verifique os Fatos</title>
<meta name="description" content="Acompanhe a checagem em tempo real das falas e propostas dos candidatos a presidente no debate eleitoral da Globo.">
<link rel="canonical" href="https://verifiqueosfatos.com/">

<!-- Open Graph (WhatsApp, Facebook, LinkedIn, Telegram, Discord) -->
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://verifiqueosfatos.com/">
<meta property="og:title" content="Verifique os Fatos">
<meta property="og:description" content="Acompanhe a checagem em tempo real das falas e propostas dos candidatos a presidente no debate eleitoral da Globo.">
<meta property="og:image" content="https://verifiqueosfatos.com/verifique-os-fatos.png">
<meta property="og:image:secure_url" content="https://verifiqueosfatos.com/verifique-os-fatos.png">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Verifique os Fatos">
</head>
<body>
  <div class="layout">
    <header>
      <h1>🔍 Verifique os Fatos</h1>
      <h2>Um projeto feito pela comunidade para a comunidade. Acompanhe a checagem em tempo real das falas e propostas dos candidatos a presidente em 2026</h2>
    </header>

    <main></main>
  </div>

  <script>
    const labels = {
      // name
      n: {
        1: 'Lula',
        2: 'Flávio',
      },
      // checks
      c: {
        1: 'Verdadeiro',
        2: 'Falso',
        3: 'Parcial'
      },
      // images
      i: {
        1: 'lula.webp',
        2: 'flavio.webp',
      }
    };

    // Keep state in memory
    let currentPosts = [];

    function getLS() {
      try {
        return JSON.parse(localStorage.getItem('data')) || [];
      } catch {
        return [];
      }
    }

    function createCardHTML(item, index) {
      return `
        <article class="article-card" style="--animation-order: ${index};">
          <div class="card-header">
            <img src="/${labels.i[item.n]}" alt="Foto de perfil do ${labels.n[item.n]}" decoding="async" loading="lazy"/>
            <div>
              <div class="name">${labels.n[item.n]}</div>
              <div class="badge check" data-type="${item.c}">${labels.c[item.c]}</div>
            </div>
          </div>
          <div class="card-body">
            <p class="card-title">Disse que: ${escapeHTML(item.t)}</p>
            <p class="card-text">${escapeHTML(item.v)}</p>
          </div>
        </article>
      `;
    }

    function render(newData, containerSelector = 'main') {
      const items = newData || getLS();

      // 1. Skip completely if the content hasn't changed at all
      if (JSON.stringify(items) === JSON.stringify(currentPosts)) {
        return;
      }

      const mainTarget = document.querySelector(containerSelector);
      if (!mainTarget) return;

      // Ensure the .article-grid wrapper exists
      let grid = mainTarget.querySelector('.article-grid');
      if (!grid) {
        grid = document.createElement('div');
        grid.className = 'article-grid';
        mainTarget.appendChild(grid);
      }

      // Preserve the incremental append optimization when existing items are unchanged.
      // Rebuild the grid if an existing item was edited or removed.
      const unchangedPrefix = items.length >= currentPosts.length &&
        currentPosts.every((post, index) =>
          JSON.stringify(post) === JSON.stringify(items[index]));

      if (!unchangedPrefix) {
        grid.innerHTML = items.map((item, index) => createCardHTML(item, index)).join('');
      } else {
        const newItems = items.slice(currentPosts.length);
        if (newItems.length > 0) {
          const fragment = document.createDocumentFragment();

          newItems.forEach((item, idx) => {
            const indexInTotal = currentPosts.length + idx;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = createCardHTML(item, indexInTotal).trim();
            fragment.appendChild(tempDiv.firstChild);
          });

          grid.appendChild(fragment);
        }
      }

      // Update in-memory reference
      currentPosts = items;
      // Scroll
      setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 400);
      
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function generateAlphanumeric(length = 6) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }
    
    const DELAY = 15000;
    const NOW = new Date();
    const INTERVAL = DELAY + NOW.getSeconds();    
    const URI_POSTS_JSON = '/posts.json';

    function update() {
      fetch(`${URI_POSTS_JSON}?v=${generateAlphanumeric()}`)
        .then(r => r.json())
        .then(data => {
          if (Array.isArray(data) && !data.length) {
            window.localStorage.removeItem('data');
            render([]);
          }

          if (data && data.length) {
            // Save to localStorage and update DOM incrementally
            localStorage.setItem('data', JSON.stringify(data));
            render(data);
          }
        })
        .catch(console.error);
    }

    // Initial render from localStorage, then perform first fetch
    render();
    update();
    setInterval(update, INTERVAL);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
